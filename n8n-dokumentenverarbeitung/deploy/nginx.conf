# Reverse-Proxy: TLS, Dashboard als eigene Seite, n8n dahinter.
# Das Dashboard läuft so ohne die Sandbox, mit der n8n eigene HTML-Antworten abschottet
# (sonst ist die PDF-Vorschau blockiert).
server {
  listen 443 ssl;
  http2 on;
  server_name _;
  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  client_max_body_size 30m;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;

  location = / { return 302 /belegzentrale/; }

  location /belegzentrale/ {
    alias /usr/share/nginx/belegzentrale/;
    index index.html;
    add_header Cache-Control "no-store" always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' blob: data:; object-src 'self' blob:; frame-src 'self' blob:; connect-src 'self'" always;
  }

  # Webhooks (Upload, API) gehen im Queue-Modus an den eigenen Webhook-Prozess
  location /webhook/ {
    proxy_pass http://n8n-webhook:5678;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 300s;
  }

  # n8n-Oberfläche: nur aus dem Firmennetz freigeben
  location / {
    # allow 10.0.0.0/8; deny all;
    proxy_pass http://n8n:5678;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 300s;
  }
}
server {
  listen 80;
  return 301 https://$host$request_uri;
}
